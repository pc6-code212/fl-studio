<app-toolbar
  [bpm]="store.bpm()"
  [swing]="store.swing()"
  [masterVolume]="store.masterVolume()"
  [isPlaying]="store.isPlaying()"
  [isRecording]="store.isRecording()"
  [songMode]="store.songMode()"
  [patternNumber]="store.patternNumber()"
  [patternName]="store.patternName()"
  [patternList]="store.patternList()"      [keyboardPiano]="store.keyboardPiano()"
      [panels]="store.panels()"
      [canUndo]="store.canUndo()"
      [canRedo]="store.canRedo()"
  (playToggle)="store.togglePlay()"
  (stopPressed)="store.stop()"
  (recordToggle)="store.toggleRecord()"
  (keyboardPianoToggle)="store.toggleKeyboardPiano()"
  (panelToggle)="store.togglePanel($event)"
  (songModeChange)="store.setSongMode($event)"
  (bpmChange)="store.setBpm($event)"
  (swingChange)="store.setSwing($event)"
  (patternSelect)="store.setPattern($event)"      (patternAdd)="store.addPattern()"
      (undo)="store.undo()"
      (redo)="store.redo()" />

<ng-template #channelRackPanel>
  <app-channel-rack
    [channels]="store.channels()"
    [steps]="store.steps"
    [selected]="store.selectedChannel()"
    [currentStep]="store.channelStep()"
    [isPlaying]="store.isPlaying()"
    [collapsed]="store.panels().channelRack.collapsed"
    [maximized]="store.panels().channelRack.maximized"
    [floating]="store.panels().channelRack.floating"
    (select)="store.selectChannel($event)"
    (toggleStep)="store.setStep($event.id, $event.step, $event.active)"
    (toggleMute)="store.toggleMute($event)"
    (toggleSolo)="store.toggleSolo($event)"
    (preview)="store.previewChannel($event)"
    (openPianoRoll)="store.openInPianoRoll($event)"
    (panChange)="store.setChannelPan($event.id, $event.pan)"
    (volumeChange)="store.setChannelVolume($event.id, $event.volume)"
    (mixerChannelChange)="store.setChannelMixer($event.id, $event.mixerChannel)"
    (collapseToggle)="store.togglePanelCollapsed('channelRack')"
    (maximizeToggle)="store.togglePanelMaximized('channelRack')"
    (floatToggle)="store.togglePanelFloating('channelRack')"
    (headerDrag)="onPanelDragStart('channelRack', $event)"
    (closePanel)="store.closePanel('channelRack')" />
</ng-template>

<ng-template #pianoRollPanel>
  <app-piano-roll
    [rows]="store.pianoRows()"
    [steps]="store.pianoRollSteps()"
    [stepsPerBar]="store.stepsPerBar"
    [currentStep]="store.currentStep()"
    [isPlaying]="store.isPlaying()"
    [channelName]="store.selected().name"
    [pressedNotes]="store.activeNotes()"
    [collapsed]="store.panels().pianoRoll.collapsed"
    [maximized]="store.panels().pianoRoll.maximized"
    [floating]="store.panels().pianoRoll.floating"
    (toggleNote)="store.setNote($event.row, $event.step, $event.active, $event.length)"
    (resizeNote)="store.resizeNote($event.row, $event.oldStart, $event.start, $event.length)"
    (moveNote)="store.moveNote($event.fromRow, $event.fromStep, $event.toRow, $event.toStep)"
    (noteOn)="store.pressNote($event)"
    (noteOff)="store.releaseNote($event)"
    (extendBars)="store.extendPianoRollBars(8)"
    (collapseToggle)="store.togglePanelCollapsed('pianoRoll')"
    (maximizeToggle)="store.togglePanelMaximized('pianoRoll')"
    (floatToggle)="store.togglePanelFloating('pianoRoll')"
    (headerDrag)="onPanelDragStart('pianoRoll', $event)"
    (closePanel)="store.closePanel('pianoRoll')" />
</ng-template>

<ng-template #playlistPanel>
  <app-playlist
    [tracks]="store.playlistTracks()"
    [clips]="store.playlistClips()"
    [clipNotes]="store.playlistClipNotes()"
    [patternLength]="store.pianoRollTotalSteps()"
    [bars]="store.playlistBars()"
    [stepsPerBar]="store.stepsPerBar"
    [playhead]="store.playlistStep()"
    [isPlaying]="store.isPlaying()"
    [fill]="!store.panels().pianoRoll.open || store.panels().pianoRoll.collapsed || store.panels().pianoRoll.floating"
    [collapsed]="store.panels().playlist.collapsed"
    [maximized]="store.panels().playlist.maximized"
    [floating]="store.panels().playlist.floating"
    (toggleClip)="store.setPlaylistClip($event.track, $event.start, $event.active)"
    (openClip)="store.openClipInPianoRoll($event)"
    (resizeClip)="store.resizePlaylistClip($event.id, $event.start, $event.length)"
    (toggleMute)="store.togglePlaylistMute($event)"
    (toggleSolo)="store.togglePlaylistSolo($event)"
    (extendBars)="store.extendPlaylistBars(8)"
    (collapseToggle)="store.togglePanelCollapsed('playlist')"
    (maximizeToggle)="store.togglePanelMaximized('playlist')"
    (floatToggle)="store.togglePanelFloating('playlist')"
    (headerDrag)="onPanelDragStart('playlist', $event)"
    (closePanel)="store.closePanel('playlist')" />
</ng-template>

<ng-template #mixerPanel>
  <app-mixer-panel
    [channels]="store.channels()"
    [masterVolume]="store.masterVolume()"
    [isPlaying]="store.isPlaying()"
    [currentStep]="store.channelStep()"
    [collapsed]="store.panels().mixer.collapsed"
    [maximized]="store.panels().mixer.maximized"
    [floating]="store.panels().mixer.floating"
    (volumeChange)="store.setChannelVolume($event.id, $event.volume)"
    (masterVolumeChange)="store.setMasterVolume($event)"
    (toggleMute)="store.toggleMute($event)"
    (toggleSolo)="store.toggleSolo($event)"
    (collapseToggle)="store.togglePanelCollapsed('mixer')"
    (maximizeToggle)="store.togglePanelMaximized('mixer')"
    (floatToggle)="store.togglePanelFloating('mixer')"
    (headerDrag)="onPanelDragStart('mixer', $event)"
    (closePanel)="store.closePanel('mixer')" />
</ng-template>

<main
  class="workspace"
  [style.grid-template-columns]="workspaceColumns()"
  [style.--rack-h]="store.rackHeight() + 'px'"
  [style.--playlist-h]="store.playlistHeight() + 'px'">
  <app-browser-panel
    [tab]="store.activeBrowserTab()"
    [sections]="store.browserSections"
    [library]="store.library()"
    [loading]="store.libraryLoading()"
    [error]="store.libraryError()"
    [openMessage]="store.openMessage()"
    (tabChange)="store.setBrowserTab($event)"
    (reload)="store.loadLibrary()"
    (openFolder)="store.openFolder($any($event))"
    (previewFile)="store.previewFile($event)" />

  <app-max-section
    [channelRackTemplate]="channelRackPanel"
    [pianoRollTemplate]="pianoRollPanel"
    [playlistTemplate]="playlistPanel"
    (rackResizeStart)="onRackResizeStart($event)"
    (playlistResizeStart)="onPlaylistResizeStart($event)"
    (panelResizeStart)="onPanelResizeStart($event.id, $event.event)"
    [mixerTemplate]="mixerPanel" />

  @if (store.panels().mixer.open && !store.panels().mixer.maximized) {
    @if (!store.panels().mixer.floating) {
      <div class="vsplit" title="Drag to resize" (pointerdown)="onMixerResizeStart($event)"></div>
    }
    <div
      class="panel-slot"
      [class.floating]="store.panels().mixer.floating"
      [class.collapsed]="store.panels().mixer.collapsed"
      [style.z-index]="store.frontPanel() === 'mixer' ? 140 : 130"
      (pointerdown)="store.bringPanelToFront('mixer')"
      [style.left.px]="store.panels().mixer.floating ? store.panels().mixer.x : null"
      [style.top.px]="store.panels().mixer.floating ? store.panels().mixer.y : null"
      [style.width.px]="store.panels().mixer.floating ? store.panels().mixer.width : null"
      [style.height.px]="store.panels().mixer.floating ? store.panels().mixer.height : null">
      <ng-container [ngTemplateOutlet]="mixerPanel"></ng-container>
      @if (store.panels().mixer.floating) {
        <div
          class="resize-grip"
          title="Drag to resize"
          (pointerdown)="onPanelResizeStart('mixer', $event)"></div>
      }
    </div>
  }
</main>

<app-status-bar
  [patternNumber]="store.patternNumber()"
  [patternName]="store.patternName()"
  [selectedName]="store.selected().name"
  [bpm]="store.bpm()"
  [swing]="store.swing()" />

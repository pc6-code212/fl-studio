<div class="piano-roll panel" [class.collapsed]="collapsed()" [class.maximized]="maximized()">
  <div class="panel-header" (pointerdown)="onHeaderPointerDown($event)">
    <h2>Piano Roll &mdash; {{ channelName() }}</h2>
    <div class="header-actions">
      <span class="hint">C0&ndash;C10 &middot; scroll for full range</span>
      <div class="win-controls">
        <button class="win-btn" title="Hide" (click)="collapseToggle.emit()">–</button>
        <button class="win-btn" [title]="maximized() ? 'Restore' : 'Maximize'" (click)="maximizeToggle.emit()">{{ maximized() ? '❐' : '□' }}</button>
        <button class="win-btn" [title]="floating() ? 'Dock panel' : 'Pop out panel'" (click)="floatToggle.emit()">{{ floating() ? '↙' : '↗' }}</button>
        <button class="win-btn close" title="Close" (click)="closePanel.emit()">✕</button>
      </div>
    </div>
  </div>
  <div class="piano-body" #body>
    @for (row of rows(); track row.label; let rowIndex = $index) {
      <div class="piano-row" [attr.data-note]="row.label">
        <div class="key" [class.black]="row.black">{{ row.label }}</div>
        @for (s of steps(); track s) {
          <button
            class="note-cell"
            [class.black]="row.black"
            [class.beat]="s % 4 === 0"
            [class.on]="row.notes[s]"
            [class.playing]="isPlaying() && s === currentStep()"
            (click)="toggleNote.emit({ row: rowIndex, step: s })">
          </button>
        }
      </div>
    }
  </div>
</div>

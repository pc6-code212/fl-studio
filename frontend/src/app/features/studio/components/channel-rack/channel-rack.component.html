<div class="channel-rack panel" [class.collapsed]="collapsed()" [class.maximized]="maximized()">
  <div class="panel-header" title="Double-click to pop out or dock" (dblclick)="onHeaderDoubleClick($event)" (pointerdown)="onHeaderPointerDown($event)">
    <h2>Channel Rack</h2>
    <div class="header-actions">
      <span class="hint">{{ channels().length }} channels &middot; 16 steps</span>
      <div class="win-controls">
        <button class="win-btn" title="Hide" (click)="collapseToggle.emit()">–</button>
        <button class="win-btn" [title]="maximized() ? 'Pop out' : 'Maximize'" (click)="maximizeToggle.emit()">{{ maximized() ? '❐' : '⛶' }}</button>
        <button class="win-btn" [title]="floating() ? 'Dock' : 'Pop out'" (click)="floatToggle.emit()">{{ floating() ? '❐' : '□' }}</button>
        <button class="win-btn close" title="Close" (click)="closePanel.emit()">✕</button>
      </div>
    </div>
  </div>

  <div class="rack-ruler">
    <span class="cell"></span>
    <span class="cell">PAN</span>
    <span class="cell">VOL</span>
    <span class="cell">MIX</span>
    <span class="cell name-col">CHANNEL</span>
    <span class="cell">SOLO</span>
    @for (s of steps(); track s) {
      <span class="step-num" [class.beat]="s % 4 === 0">{{ s + 1 }}</span>
    }
  </div>

  <div class="rack-body">
    @for (ch of channels(); track ch.id; let i = $index) {
      <div
        class="rack-row"
        [class.selected]="i === selected()"
        [class.muted]="ch.muted"
        (click)="select.emit(i)">

        <button
          class="radio-btn"
          [class.on]="!ch.muted"
          [title]="ch.muted ? 'Unmute' : 'Mute'"
          (click)="toggleMute.emit(ch.id); $event.stopPropagation()">
          <span class="led-dot" [style.background]="ch.color"></span>
        </button>

        <div
          class="knob pan"
          [title]="'Pan ' + ch.pan"
          (pointerdown)="startPanDrag($event, ch)">
          <div class="knob-dial" [style.transform]="'rotate(' + knobAngle(ch.pan) + 'deg)'"></div>
        </div>

        <div
          class="knob vol"
          [title]="'Volume ' + ch.volume"
          (pointerdown)="startVolumeDrag($event, ch)">
          <div class="knob-dial" [style.transform]="'rotate(' + knobAngle(ch.volume) + 'deg)'"></div>
        </div>

        <input
          class="mixer-input"
          type="number"
          min="1"
          max="99"
          title="Mixer channel"
          [ngModel]="ch.mixerChannel"
          (ngModelChange)="mixerChannelChange.emit({ id: ch.id, mixerChannel: $event })"
          (click)="$event.stopPropagation()">

        <button
          class="ch-name"
          [style.border-left-color]="ch.color"
          title="Double-click to open in Piano Roll"
          (click)="preview.emit(ch)"
          (dblclick)="openPianoRoll.emit(i)">
          <span class="led" [style.background]="ch.color"></span>
          <span class="ch-label">{{ ch.name }}</span>
        </button>

        <button
          class="solo-btn"
          [class.on]="ch.solo"
          title="Solo"
          (click)="toggleSolo.emit(ch.id); $event.stopPropagation()">&#9654;</button>

        @for (s of steps(); track s) {
          <button
            class="step"
            [class.beat]="s % 4 === 0"
            [class.active]="ch.steps[s]"
            [class.playing]="isPlaying() && s === currentStep()"
            [style.--ch-color]="ch.color"
            (click)="toggleStep.emit({ id: ch.id, step: s, active: true })"
            (contextmenu)="onStepContextMenu($event, ch.id, s)">
          </button>
        }
      </div>
    }
  </div>
</div>

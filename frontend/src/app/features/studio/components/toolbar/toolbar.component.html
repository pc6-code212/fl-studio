<section class="toolbar">
  <div class="transport">
    <button class="tbtn" title="Undo (Ctrl+Z)" [disabled]="!canUndo()" (click)="undo.emit()">&#8634;</button>
    <button class="tbtn" title="Redo (Ctrl+Y)" [disabled]="!canRedo()" (click)="redo.emit()">&#8635;</button>
    <button class="tbtn" title="Rewind" (click)="stopPressed.emit()">&#9198;</button>
    <button class="tbtn stop" title="Stop" (click)="stopPressed.emit()">&#9632;</button>
    <button class="tbtn play" [class.on]="isPlaying()" title="Play / Pause (Space)" (click)="playToggle.emit()">&#9654;</button>
    <button class="tbtn rec" [class.on]="isRecording()" title="Record" (click)="recordToggle.emit()">&#9679;</button>
  </div>

  <div class="mode-switch">
    <button [class.active]="!songMode()" (click)="songModeChange.emit(false)">PAT</button>
    <button [class.active]="songMode()" (click)="songModeChange.emit(true)">SONG</button>
  </div>

  <div class="pattern-select">
    <div class="pattern-dropdown">
      <button
        class="tbtn sm"
        title="Show pattern list"
        [class.on]="patternMenuOpen()"
        (click)="togglePatternMenu($event)">&#9662;</button>
      @if (patternMenuOpen()) {
        <ul class="pattern-menu">
          @for (item of patternList(); track item.number) {
            <li>
              <button
                class="pattern-item"
                [class.active]="item.number === patternNumber()"
                (click)="selectPattern(item.number)">
                <span class="pattern-item-num">{{ item.number }}</span>
                <span class="pattern-item-name">{{ item.name }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
    <div class="pattern-display">
      <span class="pattern-num">Pattern {{ patternNumber() }}</span>
      <span class="pattern-name">{{ patternName() }}</span>
    </div>
    <button class="tbtn sm add" title="Add new pattern (new empty channel rack)" (click)="patternAdd.emit()">+</button>
  </div>

  <div class="tempo">
    <label>BPM</label>
    <input
      type="number"
      min="20"
      max="300"
      [ngModel]="bpm()"
      (ngModelChange)="bpmChange.emit($event)">
  </div>

  <div class="swing">
    <label>Swing</label>
    <input
      type="range"
      min="0"
      max="100"
      [ngModel]="swing()"
      (ngModelChange)="swingChange.emit($event)">
    <span class="val">{{ swing() }}%</span>
  </div>

  <div class="master">
    <label>Master</label>
    <div class="meter horizontal">
      <div class="meter-fill" [style.width.%]="isPlaying() ? 74 : 0"></div>
    </div>
    <span class="val">{{ masterVolume() }}</span>
  </div>

  <button
    class="tbtn keys"
    [class.on]="keyboardPiano()"
    title="Computer keyboard as piano (Z-M / Q-U)"
    (click)="keyboardPianoToggle.emit()">
    <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
      <rect x="2.5" y="5" width="19" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M7 19V9M12 19V9M17 19V9" stroke="currentColor" stroke-width="1.1" opacity="0.7" />
      <rect x="5" y="5" width="3" height="7" rx="0.6" fill="currentColor" />
      <rect x="10" y="5" width="3" height="7" rx="0.6" fill="currentColor" />
      <rect x="15" y="5" width="3" height="7" rx="0.6" fill="currentColor" />
    </svg>
  </button>

  <div class="panel-toggles">
    <button
      class="panel-btn"
      [class.active]="panels().channelRack.open && !panels().channelRack.collapsed"
      title="Show / hide Channel Rack"
      (click)="panelToggle.emit('channelRack')">RACK</button>
    <button
      class="panel-btn"
      [class.active]="panels().pianoRoll.open && !panels().pianoRoll.collapsed"
      title="Show / hide Piano Roll"
      (click)="panelToggle.emit('pianoRoll')">PIANO</button>
    <button
      class="panel-btn"
      [class.active]="panels().playlist.open && !panels().playlist.collapsed"
      title="Show / hide Playlist"
      (click)="panelToggle.emit('playlist')">PLAYLIST</button>
    <button
      class="panel-btn"
      [class.active]="panels().mixer.open && !panels().mixer.collapsed"
      title="Show / hide Mixer"
      (click)="panelToggle.emit('mixer')">MIXER</button>
  </div>
</section>

<footer class="statusbar">
  <span class="status-item">Pattern {{ patternNumber() }}: {{ patternName() }}</span>
  <span class="status-item">Selected: <b>{{ selectedName() }}</b></span>
  <span class="status-item">BPM {{ bpm() }} &middot; Swing {{ swing() }}%</span>
  <span class="status-right">Space = Play/Stop &middot; click steps / keys to hear sound</span>
</footer>
